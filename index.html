<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Plan · The 5-Step Money Plan Calculator</title>
<meta name="description" content="Enter what you earn and see exactly how to split it across Safety, Growth, Fixed &amp; Safe, Skill and Live buckets.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">
<noscript><p style="padding:2rem;text-align:center">Please enable JavaScript to use Money Plan.</p></noscript>
<div class="blobs"><i></i><i></i><i></i></div>

<main class="max-w-6xl mx-auto px-5 sm:px-8 pb-20">
  <nav class="flex items-center justify-between py-5">
    <div class="flex items-center gap-2 font-semibold"><span class="text-xl">💰</span><span>Money Plan</span></div>
    <div class="flex items-center gap-2">
      <select id="cur" class="sel" aria-label="Currency"><option value="INR">₹ INR</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select>
      <button id="theme" class="icon-btn" aria-label="Toggle theme">◐</button>
    </div>
  </nav>

  <header class="text-center pt-8 sm:pt-14 pb-10 rise">
    <p class="text-sm font-semibold muted tracking-wide">The 5-Step Money Plan</p>
    <h1 class="mt-3 text-[2.5rem] leading-[1.05] sm:text-7xl font-extrabold tracking-[-0.04em]">Give every rupee<br class="hidden sm:block"> <span style="background:linear-gradient(90deg,var(--safety),var(--skill),var(--live));-webkit-background-clip:text;background-clip:text;color:transparent">a job.</span></h1>
    <p class="mt-5 text-lg sm:text-xl muted max-w-xl mx-auto">Enter what you earn. See exactly where it should go.</p>
  </header>

  <section class="glass p-6 sm:p-10 rise" style="animation-delay:.08s">
    <div class="grid md:grid-cols-[1.4fr_1fr] gap-8 md:gap-12 items-end">
      <div>
        <label for="amount" class="text-sm font-medium muted">Total amount</label>
        <div class="flex items-baseline gap-2 mt-1"><span id="sym" class="text-4xl sm:text-6xl font-bold muted">₹</span><input id="amount" class="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
        <div id="chips" class="flex flex-wrap gap-2 mt-4"></div>
      </div>
      <div>
        <div id="seg" class="seg" role="tablist"><div class="pill"></div>
          <button id="p1" class="on" role="tab">Phase 1</button><button id="p2" role="tab">Phase 2</button></div>
        <p id="note" class="mt-3 text-sm muted leading-relaxed"></p>
      </div>
    </div>
  </section>

  <section class="grid lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] gap-5 mt-5">
    <div class="glass p-6 sm:p-8 lg:sticky lg:top-6 self-start rise" style="animation-delay:.16s">
      <div class="relative mx-auto max-w-[320px]">
        <svg id="donut" viewBox="0 0 200 200" class="w-full -rotate-90"><circle cx="100" cy="100" r="80" fill="none" stroke="var(--track)" stroke-width="14" opacity=".5"/></svg>
        <div class="absolute inset-0 grid place-items-center text-center pointer-events-none">
          <div><p class="text-xs font-semibold muted uppercase tracking-widest">Total</p><p id="center" class="text-2xl sm:text-3xl font-bold tracking-tight mt-1">–</p><p id="centerSub" class="text-xs muted mt-1">&nbsp;</p></div>
        </div>
      </div>
      <div class="flex gap-3 mt-8">
        <button id="copy" class="btn flex-1">Copy summary</button>
        <button id="reset" class="btn ghost">Reset</button>
      </div>
    </div>
    <div id="list" class="grid gap-4"></div>
  </section>

  <p class="text-center text-xs muted mt-12">A simple planning framework, not personalised financial advice.</p>
</main>
<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
